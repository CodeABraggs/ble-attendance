spring.application.name=ble-attendance-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ble_attendence}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Face verification (MobileFaceNet cosine similarity). Calibrate on real devices before relying on them.
# >= match-threshold: PRESENT; >= review-threshold: PENDING_REVIEW for the teacher; below: rejected.
attendance.face.match-threshold=0.60
attendance.face.review-threshold=0.45
# Anti-spoofing score from the phone; above this the sample is treated as a photo/screen.
attendance.face.spoof-threshold=0.20
# Similarity this close to the enrolled sample is suspicious (replayed data), so it goes to review.
attendance.face.replay-threshold=0.995
