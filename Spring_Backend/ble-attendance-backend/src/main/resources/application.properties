spring.application.name=ble-attendance-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ble_attendence}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:msr123}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Random liveness actions (blink/turn/smile) required at attendance time, 0-4. 0 = just look at the
# camera (easiest; photos/screens are still caught by the anti-spoofing model). 1-2 = stronger against
# photos and videos of the student, but slower for students. Takes effect without an app update.
attendance.face.challenge-actions=0

# Face verification (MobileFaceNet cosine similarity between the sample and the best enrolled template).
# >= match-threshold: PRESENT; >= review-threshold: PENDING_REVIEW for the teacher; below: rejected and
# the student may retry. Every check is logged with its scores ("Face check ...") for calibration.
# For reference, MobileFaceNet's own LFW evaluation picks its best threshold around cosine 0.3.
attendance.face.match-threshold=0.50
attendance.face.review-threshold=0.35
# Confident matches (>= this) are remembered as extra templates, adapting to the student's usual conditions.
attendance.face.adapt-threshold=0.65
# Anti-spoofing score from the phone; above this the sample is treated as a photo/screen.
attendance.face.spoof-threshold=0.20
# Similarity this close to the enrolled sample is suspicious (replayed data), so it goes to review.
attendance.face.replay-threshold=0.995
